<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>VuPay · Administration</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F5F7FC;--card:#fff;--ink:#0F1426;--mute:#5A6178;--line:#E4E8F2;--blue:#2255FF;--mint:#08875A;--red:#C52A1C;--coral:#FF6B3D}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:28px 18px 60px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:28px}h2{margin:0;font-size:19px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(20,32,80,.06)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stats b{display:block;font-size:24px;white-space:nowrap}.mute{color:var(--mute);font-size:14px}
input{height:48px;border:2px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;width:100%}
button{height:44px;border:0;border-radius:12px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
button.ok{background:var(--mint)}button.ko{background:#fff;color:var(--red);border:2px solid var(--line)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num{text-align:right;font-weight:700}
.st{font-weight:700}.st.att{color:var(--coral)}.st.tr{color:var(--blue)}.st.env{color:var(--mint)}.st.ech{color:var(--red)}
.row{display:flex;gap:8px;align-items:center}
.err{color:var(--red);font-weight:600;min-height:1em}
</style>
</head>
<body>
<main>
  <h1>VuPay · Administration</h1>
  <form id="login" class="card row" style="flex-wrap:wrap">
    <label for="tk" style="flex:1 1 240px"><span class="mute">Jeton administrateur (ADMIN_TOKEN du fichier .env)</span><input id="tk" type="password" autocomplete="off"></label>
    <button type="submit" style="align-self:flex-end">Ouvrir</button>
  </form>
  <p class="err" id="err"></p>
  <section id="dash" hidden>
    <div class="stats" id="stats"></div>
    <div class="card" style="margin-top:20px">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>Demandes de retrait</h2><button id="rf" type="button">Actualiser</button></div>
      <p class="mute" style="margin:0 0 10px">En mode manuel (PAYOUT_PROVIDER=manual), envoie l’argent depuis ton compte marchand puis marque la demande comme envoyée. « Échoué » rembourse le solde de l’utilisateur.</p>
      <div class="scroll"><table><thead><tr><th>Date</th><th>Nom</th><th>Opérateur</th><th>Numéro</th><th>Montant</th><th>Référence</th><th>Statut</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
  </section>
</main>
<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fcfa=n=>Number(n).toLocaleString("fr-FR").replace(/\s/g," ")+" FCFA";
let token="";try{token=sessionStorage.getItem("vupay_admin")||""}catch(e){}
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{"X-Admin-Token":token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Erreur");return d;
}
async function load(){
  $("err").textContent="";
  try{
    const [s,w]=await Promise.all([api("GET","/api/admin/stats"),api("GET","/api/admin/withdrawals")]);
    $("login").hidden=true;$("dash").hidden=false;
    $("stats").innerHTML=[["Utilisateurs",s.users],["Vidéos validées aujourd’hui",s.viewsToday],["Total versé aux utilisateurs",fcfa(s.paidToUsers)],["Retraits en attente",fcfa(s.pendingWithdrawals)],["Soldes à payer",fcfa(s.balances)]]
      .map(([l,v])=>`<div class="card"><span class="mute">${l}</span><b>${esc(v)}</b></div>`).join("");
    const cls={"En attente":"att","En traitement":"tr","Envoyé":"env","Échoué":"ech"};
    $("rows").innerHTML=w.length?w.map(t=>`<tr><td>${esc(new Date(t.at).toLocaleString("fr-FR"))}</td><td>${esc(t.name)}</td><td>${esc(t.op)}</td><td>${esc(t.num)}</td><td class="num">${fcfa(-t.amount)}</td><td>${esc(t.ref)}</td><td><span class="st ${cls[t.status]||""}">${esc(t.status)}</span></td>
      <td>${t.status==="En attente"||t.status==="En traitement"?`<span class="row"><button class="ok" data-ref="${esc(t.ref)}" data-s="Envoyé">Marquer envoyé</button><button class="ko" data-ref="${esc(t.ref)}" data-s="Échoué">Échoué</button></span>`:""}</td></tr>`).join("")
      :`<tr><td colspan="8" class="mute">Aucune demande pour l’instant.</td></tr>`;
  }catch(e){$("err").textContent=e.message;$("login").hidden=false;$("dash").hidden=true}
}
$("login").onsubmit=e=>{e.preventDefault();token=$("tk").value.trim();try{sessionStorage.setItem("vupay_admin",token)}catch(e){}load()};
$("rf").onclick=load;
$("rows").addEventListener("click",async e=>{const b=e.target.closest("button[data-ref]");if(!b)return;
  if(b.dataset.s==="Échoué"&&!b.dataset.sure){b.dataset.sure="1";b.textContent="Confirmer";return}
  b.disabled=true;try{await api("POST","/api/admin/withdrawals/"+encodeURIComponent(b.dataset.ref),{status:b.dataset.s});load()}catch(err){$("err").textContent=err.message;b.disabled=false}});
if(token)load();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VuPay</title>
<meta name="theme-color" content="#2255FF">
<meta name="description" content="Regarde des vidéos, réponds à une question, encaisse des FCFA sur ton Mobile Money.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* VOICE: a polished mobile-money app — warm, bright, trustworthy.
   IDEA: a video wallet; every task is a 16:9 video card, playback goes full-screen landscape.
   PICTURE: illustrated video scenes (shoe, latte, phone…) drawn in SVG, large and horizontal.
   COLOUR and TYPE: VuPay blue #2255FF, coral accent #FF6B3D, mint for earnings; Plus Jakarta Sans throughout.
   LAYOUT: phone-width column, soft cards, floating tab bar; landscape stage for playback. */
:root{color-scheme:light dark;
--bg:light-dark(#E9EDF7,#090B12);--app:light-dark(#F5F7FC,#10131C);--card:light-dark(#FFFFFF,#181C28);
--line:light-dark(#E4E8F2,#262B3A);--ink:light-dark(#0F1426,#EEF1F8);--mute:light-dark(#5A6178,#A2A9BD);
--blue:#2255FF;--blueDeep:#1238C9;--blueSoft:light-dark(#E8EEFF,#17244F);--coral:#FF6B3D;--coralSoft:light-dark(#FFEDE6,#3A2017);
--mint:light-dark(#08875A,#46D69C);--mintSoft:light-dark(#E2F7EE,#11342A);--red:light-dark(#C52A1C,#FF8A80);--redSoft:light-dark(#FDECEA,#3A1A18);
--shadow:0 8px 24px light-dark(rgba(20,32,80,.08),rgba(0,0,0,.35))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.shell{max-width:460px;margin:0 auto;min-height:100vh;background:var(--app);position:relative}
main{padding:20px 18px 120px;display:flex;flex-direction:column;gap:20px}
h1,h2{margin:0;line-height:1.1;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}h2{font-size:19px;font-weight:800}
.mute{color:var(--mute);font-size:14px}.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.btn{height:54px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;width:100%;box-shadow:0 8px 20px rgba(34,85,255,.3);transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--line);color:var(--mute);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.icon{width:46px;height:46px;border-radius:23px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo b{color:var(--blue)}
.avatar{width:46px;height:46px;border-radius:23px;background:var(--coral);color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;border:0;flex:none}
/* balance */
.balance{position:relative;overflow:hidden;background:var(--blue);color:#fff;border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 14px 30px rgba(34,85,255,.32)}
.balance::before,.balance::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.balance::before{width:220px;height:220px;right:-70px;top:-90px}.balance::after{width:160px;height:160px;left:-50px;bottom:-90px}
.balance>*{position:relative}
.amount{font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-.02em;white-space:nowrap;line-height:1.05}
.wbtn{height:44px;padding:0 18px;border-radius:22px;border:0;background:#fff;color:var(--blueDeep);font-weight:700;font-size:14px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px;text-align:center;line-height:1}
.ring small{display:block;font-size:10px;font-weight:600;opacity:.85;margin-top:2px}
.goal{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 6px}
.pill{height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:8px}
.pill[aria-pressed=true]{background:var(--ink);color:var(--app)}
/* video cards */
.feed{display:flex;flex-direction:column;gap:18px}
.vcard{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:none;border:0;padding:0}
.vcard:disabled{cursor:default}
.vthumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:block}
.vcard:not(:disabled):hover .vthumb{transform:translateY(-2px)}
.vthumb{transition:transform .2s}
.badge{position:absolute;font-size:13px;font-weight:700;padding:5px 10px;border-radius:10px;white-space:nowrap}
.dur{right:12px;bottom:12px;background:rgba(10,14,30,.7);color:#fff}
.gain{left:12px;top:12px;background:#fff;color:var(--mint)}
.playdot{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.doneveil{position:absolute;inset:0;background:rgba(10,14,30,.55);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;gap:6px;align-content:center;justify-items:center}
.vinfo{display:flex;gap:12px;align-items:flex-start;padding:0 4px}
.vinfo .ch{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.vt{font-weight:700;font-size:16px;line-height:1.3}
/* scene */
.scene{position:relative;overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:4%;padding:5% 6%;color:#fff;background:var(--c);container-type:size;width:100%;height:100%}
.scene .o1,.scene .o2{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.scene .o1{width:70%;aspect-ratio:1;right:-18%;top:-40%}.scene .o2{width:38%;aspect-ratio:1;left:-10%;bottom:-30%;background:rgba(0,0,0,.08)}
.scene .art{position:relative;width:100%;height:auto;max-height:92cqh}
.scene.thumb{grid-template-columns:1fr;place-items:center;padding:6% 22%}
.scap{position:relative;display:flex;flex-direction:column;gap:2cqh}
.stag{font-size:clamp(10px,3.4cqw,22px);font-weight:700;opacity:.9;background:rgba(255,255,255,.18);border-radius:8px;padding:.3em .7em;align-self:flex-start}
.cap{font-size:clamp(15px,6.2cqw,60px);font-weight:800;line-height:1.1;letter-spacing:-.01em;text-wrap:balance;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-4%)}}
.playing .art{animation:bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.cap,.playing .art{animation:none}.vthumb{transition:none}}
/* player */
.player{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.bigplay{position:absolute;inset:0;border:0;background:rgba(10,14,30,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-weight:700;font-size:14px}
.bigplay span{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--coral);border-radius:3px}
.rewardbox{display:flex;align-items:center;gap:12px;background:var(--mintSoft);border-radius:18px;padding:14px}
.rewardbox .ic{width:44px;height:44px;border-radius:14px;background:var(--mint);color:#fff;display:grid;place-items:center;flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:15px;font-weight:600;padding:8px}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--blueSoft)}
/* fullscreen landscape */
#full{position:fixed;inset:0;z-index:20;background:#000}
#full[hidden]{display:none}
.stage{position:absolute;left:50%;top:50%;width:100vw;height:100vh;transform:translate(-50%,-50%)}
@media (orientation:portrait){.stage{width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(90deg)}}
.hud{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 18px;display:flex;align-items:center;gap:14px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff}
.hud button{width:48px;height:48px;border-radius:24px;border:0;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.hud .track{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.hud .track i{display:block;height:100%;background:var(--coral)}
.hud time{font-weight:700;font-size:14px;white-space:nowrap}
.close{position:absolute;top:14px;left:14px;width:48px;height:48px;border-radius:24px;border:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:2}
.fgain{position:absolute;top:14px;right:14px;background:#fff;color:var(--mint);font-weight:800;padding:8px 14px;border-radius:12px;z-index:2;font-size:15px}
.paused{position:absolute;inset:0;border:0;background:rgba(0,0,0,.35);display:grid;place-items:center}
.paused span{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center}
/* forms & lists */
label{font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:6px}
input,select{height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;font-weight:500}
input:focus,select:focus{border-color:var(--blue);outline:none}
.tel{display:flex;gap:8px}.tel span{height:52px;display:grid;place-items:center;padding:0 14px;border-radius:14px;background:var(--blueSoft);color:var(--blue);font-weight:800;flex:none}
.tel input{flex:1}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:1em}
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.op{min-height:60px;border-radius:16px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:700;font-size:14px;text-align:left}
.op[aria-pressed=true]{border-color:var(--blue);background:var(--blueSoft)}
.op i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:13px;flex:none}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{height:40px;padding:0 14px;border-radius:20px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:13px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.amt{font-weight:800;white-space:nowrap;margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stats b{display:block;font-size:24px;font-weight:800;margin-top:4px;white-space:nowrap}
.refer{background:var(--coral);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.refer::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12);right:-50px;top:-60px}
.refer>*{position:relative}
.code{font-size:24px;font-weight:800;letter-spacing:.08em;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 14px;flex:1;text-align:center}
.rules{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:12px;align-items:center;font-size:15px}
.rules i{width:36px;height:36px;border-radius:12px;background:var(--blueSoft);color:var(--blue);display:grid;place-items:center;flex:none}
.demo{font-size:13px;color:var(--mute);text-align:center;margin:0}
/* signup */
.hero{position:relative;overflow:hidden;background:var(--blue);color:#fff;border-radius:28px;padding:26px 22px 0;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(30px,9vw,40px)}
.hero p{margin:0;opacity:.95;max-width:30ch}
.hero svg{width:100%;height:auto;display:block;margin-top:6px}
.steps{display:grid;gap:14px}
.step{display:flex;gap:14px;align-items:center;font-weight:600;font-size:15px}
.step b{width:36px;height:36px;border-radius:12px;background:var(--coralSoft);color:var(--coral);display:grid;place-items:center;flex:none}
/* nav */
nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:432px;background:var(--card);border-radius:24px;box-shadow:0 10px 30px rgba(15,20,38,.16);display:flex;padding:8px;gap:6px;z-index:10;margin-bottom:env(safe-area-inset-bottom)}
nav[hidden]{display:none}
nav button{flex:1;border:0;background:none;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;font-weight:700;font-size:14px;color:var(--mute)}
nav button[aria-current=page]{background:var(--blueSoft);color:var(--blue)}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--ink);color:var(--app);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;max-width:90vw;text-align:center;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge.new{left:12px;bottom:12px;background:var(--coral);color:#fff}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.spin{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:1}
.spin[hidden]{display:none}
.spin i{width:56px;height:56px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.paused[hidden]{display:none}
.adtag{position:absolute;top:20px;left:74px;background:#FFC94D;color:#2A1D00;font-weight:800;font-size:13px;padding:6px 10px;border-radius:8px;z-index:2;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(10,14,30,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheetbox{background:var(--app);width:100%;max-width:460px;border-radius:26px 26px 0 0;padding:12px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .25s ease;max-height:92vh;overflow:auto}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-bottom:6px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sms{position:fixed;top:10px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:436px;background:var(--card);box-shadow:0 12px 30px rgba(15,20,38,.22);border-radius:18px;padding:12px 14px;z-index:45;display:flex;gap:12px;align-items:flex-start;font-size:15px;animation:drop .3s ease}
.sms[hidden]{display:none}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.otp{letter-spacing:.5em;text-align:center;font-size:26px;font-weight:800}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;font-size:14px;min-height:44px}
.linkbtn:disabled{color:var(--mute);cursor:default}
.agree{flex-direction:row;align-items:center;gap:10px;font-weight:500;font-size:14px}
.agree input{width:22px;height:22px;flex:none}
.adcta{display:flex;gap:14px;align-items:center;text-align:left;border:0;width:100%}
.adcta .ic{width:48px;height:48px;border-radius:16px;background:var(--blueSoft);color:var(--blue);display:grid;place-items:center;flex:none}
.drop{border:2px dashed var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;font-weight:600}
.drop .ic{width:56px;height:56px;border-radius:18px;background:var(--blueSoft);color:var(--blue);display:grid;place-items:center}
.drop img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.answers{border:0;padding:0;margin:0;display:grid;gap:8px}
.answers legend{font-size:14px;font-weight:700;margin-bottom:6px}
.ans{display:flex;gap:10px;align-items:center}.ans input[type=radio]{width:24px;height:24px;flex:none;accent-color:var(--blue)}.ans input:not([type=radio]){flex:1}
.txb{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.txb:last-child{border-bottom:0}
.st{font-weight:700}.st0{color:var(--coral)}.st1{color:var(--blue)}.st2{color:var(--mint)}
.tl{list-style:none;margin:4px 0;padding:0;display:grid;gap:0}
.tl li{position:relative;padding:0 0 16px 34px;display:flex;flex-direction:column}
.tl li::before{content:"";position:absolute;left:6px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--line)}
.tl li::after{content:"";position:absolute;left:12px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.on::before{background:var(--mint)}.tl li.on::after{background:var(--mint)}
.verified{display:inline-block;font-size:12px;font-weight:700;color:var(--mint);background:var(--mintSoft);padding:2px 8px;border-radius:8px;vertical-align:middle}
.smsic svg{width:34px;height:34px}
.top{margin:-20px -18px 0;padding:20px 18px 64px;background:var(--blue);color:#fff;border-radius:0 0 32px 32px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.top::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.08);right:-110px;top:-130px}
.top::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,201,77,.16);left:-80px;bottom:-120px}
.top>*{position:relative}
.logo.light{color:#fff}.logo.light b{color:#FFC94D}
.logo.light svg rect{fill:#fff}.logo.light svg path{fill:#2255FF}
.hello{margin:6px 0 0;font-size:15px;font-weight:600;opacity:.9}
.top .amount{font-size:clamp(34px,11vw,44px)}
.top .avatar{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.summary{margin-top:-62px;position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center}
.ring.sm,.ring.sm svg{width:62px;height:62px}
.ring.sm span{color:var(--blue);font-size:15px}
.sumtxt{display:flex;flex-direction:column}
.sumtxt b{font-size:16px}
.sumstats{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.sumstats div{display:flex;flex-direction:column}
.sumstats b{font-size:18px;white-space:nowrap}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -18px 0;padding:4px 18px 14px;scrollbar-width:none;scroll-padding:0 18px}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;flex:0 0 64%}
.rail.big>*{flex-basis:88%}
.hcard,.scard{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.hcard .vthumb{border-radius:24px}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(6,10,28,.82))}
.htxt{position:absolute;left:16px;right:16px;bottom:14px;display:flex;flex-direction:column;gap:4px;color:#fff}
.hbrand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;opacity:.95}
.hbrand i{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;border:2px solid rgba(255,255,255,.7)}

function sceneHTML(t,live){

}
async function openTask(id){

async function refresh(){try{await loadAll();if(view==="tasks")tasks()}catch(e){}}
async function enterLandscape(){
  try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch(e){}
  try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock("landscape")}catch(e){}
}
function exitLandscape(){
  try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch(e){}
  try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
}
function buildFull(){
  const t=cur;if(P.frame<0)P.frame=0;full.hidden=false;
  full.innerHTML=`<div class="stage">${t.kind==="video"?`<video id="vid" playsinline preload="auto" src="${vidURL}"></video>`:t.kind==="youtube"?`<div class="ytbox"><div id="yt"></div><div class="ytshield"></div></div>`:sceneHTML(t,true)}
    <div class="spin" id="spin" hidden><i></i></div>
    <button class="close" data-act="close" aria-label="Quitter le plein écran">${I.x}</button>
    <span class="adtag">Sponsorisé · ${esc(t.brand)}</span>
    <span class="fgain">+${fcfa(t.pay)}</span>
    <button class="paused" id="pz" data-act="play" aria-label="Reprendre la lecture"><span>${I.play(38,t.color)}</span></button>
    <div class="hud"><button id="hb" data-act="play" aria-label="Lecture"></button>
    <div class="track"><i id="ftr"></i></div><time id="ftm"></time></div></div>`;
  const v=$("vid");
  if(v){
    v.addEventListener("loadedmetadata",()=>{if(P.t>0)v.currentTime=P.t});
    const guard=()=>{if(v.currentTime>P.max+1.2){v.currentTime=P.max;toast("L’avance rapide est désactivée")}};
    v.addEventListener("seeking",guard);
    v.addEventListener("timeupdate",()=>{if(v.currentTime>P.max+1.2)return guard();P.t=v.currentTime;P.max=Math.max(P.max,P.t);progress()});
    v.addEventListener("waiting",()=>spin(true));v.addEventListener("playing",()=>spin(false));
    v.addEventListener("ended",finish);
    v.addEventListener("error",()=>{toast("Impossible de lire cette vidéo");closeFull()});
  }
  if(t.kind==="youtube"){
    spin(true);
    loadYT().then(()=>{if(!P.full||cur!==t)return;
      P.yt=new YT.Player("yt",{videoId:t.youtubeId,playerVars:{controls:0,disablekb:1,fs:0,rel:0,playsinline:1,modestbranding:1,iv_load_policy:3,start:Math.floor(P.t)},
        events:{onReady:e=>{spin(false);if(P.playing)e.target.playVideo()},
          onStateChange:e=>{const S2=YT.PlayerState;
            if(e.data===S2.ENDED)return finish();
            if(e.data===S2.BUFFERING)spin(true);
            if(e.data===S2.PLAYING){spin(false);if(!P.playing){P.playing=true;hud()}}
            if(e.data===S2.PAUSED&&P.playing){P.playing=false;hud()}},
          onError:()=>{toast("Cette vidéo YouTube ne peut pas être lue ici.");closeFull()}}});
      clearInterval(ytTimer);ytTimer=setInterval(ytTick,500)})
    .catch(e=>{toast(e.message);closeFull()});
  }
  hud();progress();
}
function ytTick(){const y=P.yt;if(!y||!y.getCurrentTime)return;const c=y.getCurrentTime()||0;
  if(c>P.max+2){y.seekTo(P.max,true);toast("L’avance rapide est désactivée");return}
  P.t=c;P.max=Math.max(P.max,c);progress()}
const spin=on=>{const s=$("spin");if(s)s.hidden=!on};
function hud(){
  const pz=$("pz"),hb=$("hb");if(!hb)return;
  pz.hidden=P.playing;
  hb.dataset.act=P.playing?"pause":"play";hb.setAttribute("aria-label",P.playing?"Pause":"Lecture");
  hb.innerHTML=P.playing?I.pause:I.play(22,"#fff");
  const sc=full.querySelector(".scene");if(sc)sc.classList.toggle("playing",P.playing);
}
function progress(){
  const tr=$("ftr"),tm=$("ftm"),cap=$("cap"),d=cur.dur;
  if(tr)tr.style.width=Math.min(100,P.t/d*100)+"%";
  if(tm)tm.textContent=clock(P.t)+" / "+clock(d);
  if(cur.kind==="demo"){const f=Math.min(cur.frames.length-1,Math.floor(P.t/d*cur.frames.length));
    if(f!==P.frame){P.frame=f;if(cap){cap.textContent=cur.frames[f];cap.style.animation="none";void cap.offsetWidth;cap.style.animation=""}}}
}
function play(){
  if(!P.full){P.full=true;enterLandscape();buildFull()}
  P.playing=true;hud();
  if(cur.kind==="video"){const v=$("vid");v.play().catch(()=>{P.playing=false;hud()});return}
  if(cur.kind==="youtube"){if(P.yt&&P.yt.playVideo)P.yt.playVideo();return}
  clearInterval(timer);
  if(!P.started){P.started=true;spin(true);timer=setTimeout(()=>{spin(false);if(P.playing)timer=setInterval(tick,250)},900)}
  else timer=setInterval(tick,250);
}
function pause(){P.playing=false;clearInterval(timer);timer=null;const v=$("vid");if(v&&!v.paused)v.pause();if(P.yt&&P.yt.pauseVideo)try{P.yt.pauseVideo()}catch(e){}spin(false);hud()}
function closeFull(){pause();clearInterval(ytTimer);if(P.yt){try{P.yt.destroy()}catch(e){}P.yt=null}P.full=false;exitLandscape();full.hidden=true;full.innerHTML="";player()}
function tick(){P.t=Math.min(cur.dur,P.t+.25);P.max=P.t;if(P.t>=cur.dur)return finish();progress()}
function finish(){P.ended=true;P.t=cur.dur;closeFull();toast("Vidéo terminée : réponds à la question")}

    <label for="ap">Gain par vue<select id="ap">${[100,150,200,250,300,400,500].map(v=>`<option value="${v}" ${v===200?"selected":""}>${fcfa(v)}</option>`).join("")}</select></label></div>
    <label for="aq">Question de vérification<input id="aq" maxlength="90" placeholder="Ex. Dans quel quartier est la boutique ?"></label>
    <fieldset class="answers"><legend>Réponses (coche la bonne)</legend>
      ${[0,1,2,3].map(i=>`<div class="ans"><input type="radio" name="ar" id="r${i}" value="${i}" ${i===0?"checked":""} aria-label="Bonne réponse : choix ${i+1}"><input id="o${i}" maxlength="40" placeholder="Réponse ${i+1}" aria-label="Réponse ${i+1}"></div>`).join("")}
    </fieldset>
    <div class="err" id="ae"></div>
    <button class="btn" type="submit" id="asb">Publier la vidéo</button>
  </form>
  ${MINE.length?`<section class="card"><h2 style="margin-bottom:6px">Mes vidéos</h2>${MINE.map(c=>`<div class="tx"><span class="ic" style="background:var(--blueSoft);color:var(--blue)">${I.play(18,"#2255FF")}</span><div><div style="font-weight:700">${esc(c.title)}</div><div class="mute small">${clock(c.dur)} · ${fcfa(c.pay)} par vue · ${c.views} vue${c.views>1?"s":""} validée${c.views>1?"s":""}</div></div><button class="linkbtn" data-del="${c.id}" style="margin-left:auto;color:var(--red)">Retirer</button></div>`).join("")}</section>`:""}
  `;
  $("vf").onchange=async e=>{
    const f=e.target.files[0],ae=$("ae");if(!f)return;
    if(f.size>95*1024*1024){ae.textContent="Vidéo trop lourde (95 Mo maximum).";return}
    ae.textContent="Lecture de la vidéo…";
    try{const m=await probe(f);if(m.dur>180){ae.textContent="La vidéo dépasse 3 minutes.";return}
      draft={file:f,dur:m.dur,poster:m.poster,title:$("at").value,brand:$("ab").value};advertise()}
    catch(err){ae.textContent="Ce format n’est pas lisible sur cet appareil. Essaie un MP4."}
  };
  $("yu").onchange=async e=>{
    const ae=$("ae"),url=e.target.value.trim();if(!url)return;
    const id=parseYT(url);if(!id){ae.textContent="Ce lien YouTube n’est pas reconnu.";return}
    draft={yt:id,url,dur:0,poster:"https://i.ytimg.com/vi/"+id+"/hqdefault.jpg",title:$("at").value,brand:$("ab").value};
    ae.textContent="Lecture de la durée…";
    draft.dur=await ytDuration(id);advertise();
    if(!draft.dur)$("ae").textContent="Indique la durée de la vidéo en secondes.";
  };
  $("af").onsubmit=async e=>{
    e.preventDefault();const ae=$("ae");
    if(draft&&draft.yt&&$("yd"))draft.dur=+$("yd").value.replace(/[^\d.]/g,"")||0;
    const title=$("at").value.trim(),brand=$("ab").value.trim(),q=$("aq").value.trim(),opts=[0,1,2,3].map(i=>$("o"+i).value.trim());
    if(!draft){ae.textContent="Choisis d’abord une vidéo.";return}
    if(!title||!brand){ae.textContent="Indique le titre et la marque.";return}
    if(!q||opts.some(o=>!o)){ae.textContent="Écris la question et les 4 réponses.";return}
    const sb=$("asb");sb.disabled=true;ae.textContent="";
    if(draft.yt){
      if(!draft.dur){sb.disabled=false;ae.textContent="Indique la durée de la vidéo en secondes.";return}
      try{await api("POST","/api/videos",{youtube:draft.yt,title,brand,cat:$("ac").value,pay:+$("ap").value,q,opts,answer:+app.querySelector("input[name=ar]:checked").value,dur:draft.dur});
        draft=null;MINE=null;VIDEOS=await api("GET","/api/videos");go("tasks");toast("Vidéo publiée dans les tâches")}
      catch(err){sb.disabled=false;ae.textContent=err.message}
      return}
    try{
      const fileId=await upload(draft.file,p=>sb.textContent="Envoi de la vidéo… "+p+" %");
      sb.textContent="Publication…";
      await api("POST","/api/videos",{fileId,title,brand,cat:$("ac").value,pay:+$("ap").value,q,opts,answer:+app.querySelector("input[name=ar]:checked").value,dur:draft.dur,poster:draft.poster});
      draft=null;MINE=null;VIDEOS=await api("GET","/api/videos");go("tasks");toast("Vidéo publiée dans les tâches")}
    catch(err){sb.disabled=false;sb.textContent="Publier la vidéo";ae.textContent=err.message}
  };
}

function upload(file,onProgress){return new Promise((res,rej)=>{
  const ext=(file.name.split(".").pop()||"").toLowerCase(),type=file.type||({mp4:"video/mp4",webm:"video/webm",mov:"video/quicktime"}[ext]||"");
  const x=new XMLHttpRequest();x.open("PUT","/api/uploads");x.setRequestHeader("Authorization","Bearer "+TOKEN);x.setRequestHeader("Content-Type",type);
  x.upload.onprogress=e=>{if(e.lengthComputable)onProgress(Math.round(e.loaded/e.total*100))};
  x.onload=()=>{let d={};try{d=JSON.parse(x.responseText)}catch(e){}x.status<300?res(d.fileId):rej(new Error(d.error||"Envoi refusé."))};
  x.onerror=()=>rej(new Error("Envoi interrompu. Vérifie ta connexion."));x.send(file)})}

function ytDuration(id){return new Promise(res=>{
  let done=false;const end=d=>{if(done)return;done=true;try{p&&p.destroy()}catch(e){}box.remove();res(Math.round(d||0))};
  const box=document.createElement("div");box.style.cssText="position:fixed;left:-9999px;top:0;width:320px;height:180px";box.innerHTML='<div id="ytprobe"></div>';document.body.appendChild(box);
  let p=null;setTimeout(()=>end(0),12000);
  loadYT().then(()=>{p=new YT.Player("ytprobe",{videoId:id,playerVars:{mute:1,playsinline:1,controls:0},events:{
    onReady:e=>{const d=e.target.getDuration();if(d>0)return end(d);e.target.mute();e.target.playVideo()},
    onStateChange:e=>{const d=e.target.getDuration();if(d>0)end(d)},onError:()=>end(0)}})}).catch(()=>end(0));
})}

/* ---------- portefeuille ---------- */
const TXI={video:["var(--mintSoft)","var(--mint)",'<path d="M10 9l5 3-5 3z"/><rect x="3" y="5" width="18" height="14" rx="3"/>'],bonus:["var(--coralSoft)","var(--coral)",'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>'],out:["var(--blueSoft)","var(--blue)",'<path d="M12 19V5M6 11l6-6 6 6"/>']};
const STEPS=["En attente","En traitement","Envoyé"];
function wallet(){
  const u=S.user,cc=COUNTRIES[u.country][1],can=S.balance>=MIN_OUT;
  app.innerHTML=`
  <h1>Mes gains</h1>
  <section class="balance" style="background:var(--blueDeep)"><div class="small" style="opacity:.9;font-weight:600">Solde disponible</div><div class="amount">${fcfa(S.balance)}</div>
  <div class="goal">Total gagné depuis le début : ${fcfa(S.total)}</div></section>
  <form id="wf" class="card" style="display:flex;flex-direction:column;gap:16px" novalidate>
    <h2>Retirer sur mon Mobile Money</h2>
    <div class="ops" role="group" aria-label="Opérateur">${OPS.map(([n,c,s])=>`<button type="button" class="op" data-op="${n}" aria-pressed="${u.op===n}"><i style="background:${c}">${s}</i>${n}</button>`).join("")}</div>
    <label for="wn">Numéro<div class="tel"><span>${cc}</span><input id="wn" inputmode="tel" value="${esc(u.phone)}"></div></label>
    <label for="wa">Montant en FCFA<input id="wa" inputmode="numeric" value="${can?S.balance:""}" placeholder="Minimum ${MIN_OUT.toLocaleString("fr-FR")}"></label>
    ${can?`<div class="quick">${[2000,5000].filter(v=>v<=S.balance).map(v=>`<button type="button" data-amt="${v}">${fcfa(v)}</button>`).join("")}<button type="button" data-amt="${S.balance}">Tout retirer</button></div>`:""}
    <div class="err" id="we"></div>
    <button class="btn" type="submit" ${can?"":"disabled"}>${can?"Continuer":"Encore "+fcfa(MIN_OUT-S.balance)+" avant de retirer"}</button>
    <span class="mute small" style="text-align:center">Retrait minimum ${fcfa(MIN_OUT)} · reçu en moins de 24&nbsp;h</span>
  </form>
  <section class="card" style="padding:16px 18px"><h2 style="margin-bottom:4px">Historique</h2>
  ${S.tx.length?S.tx.map((x,i)=>{const k=TXI[x.kind||(x.amount<0?"out":"video")],st=x.kind==="out"?`<span class="st st${x.status==="Échoué"?"x":STEPS.indexOf(x.status)}">${esc(x.status)}</span>`:esc(x.status);return`<button class="tx txb" data-tx="${i}"><span class="ic" style="background:${k[0]};color:${k[1]}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${k[2]}</svg></span><span style="text-align:left"><span style="font-weight:700;font-size:15px;display:block">${esc(x.label)}</span><span class="mute small">${esc(fmtDate(x.at))} · ${st}</span></span><span class="amt" style="color:${x.amount>0?"var(--mint)":"var(--ink)"}">${x.amount>0?"+":"−"}${fcfa(Math.abs(x.amount))}</span></button>`}).join(""):'<p class="mute" style="margin:8px 0 0">Tes gains apparaîtront ici après ta première vidéo.</p>'}</section>`;
  $("wf").onsubmit=e=>{
    e.preventDefault();
    const amt=parseInt($("wa").value.replace(/\D/g,""),10),num=$("wn").value.replace(/\D/g,""),we=$("we");
    if(!amt||amt<MIN_OUT){we.textContent="Le minimum est de "+fcfa(MIN_OUT)+".";return}
    if(amt>S.balance){we.textContent="Montant supérieur à ton solde.";return}
    if(num.length<8||num.length>10){we.textContent="Vérifie le numéro (8 à 10 chiffres).";return}
    outDraft={amt,num,op:u.op,cc};
    sheet(`<h2>Confirmer le retrait</h2>
      <div class="kv"><span class="mute">Montant</span><b>${fcfa(amt)}</b></div>
      <div class="kv"><span class="mute">Frais</span><b style="color:var(--mint)">Offerts</b></div>
      <div class="kv"><span class="mute">Vers</span><b>${esc(u.op)}</b></div>
      <div class="kv"><span class="mute">Numéro</span><b>${cc} ${esc(num)}</b></div>
      <div class="kv"><span class="mute">Tu recevras</span><b style="font-size:20px">${fcfa(amt)}</b></div>
      <button class="btn" data-act="confirmOut">Confirmer le retrait</button>
      <button class="btn ghost" data-act="closeSheet">Annuler</button>`);
  };
}
async function confirmOut(){
  const d=outDraft;if(!d)return;
  const btn=sheetWrap.querySelector("[data-act=confirmOut]");if(btn){btn.disabled=true;btn.textContent="Envoi…"}
  try{const r=await api("POST","/api/withdrawals",{amount:d.amt,op:d.op,number:d.num});outDraft=null;applyMe(r.me);closeSheet();wallet();toast("Retrait en cours de traitement");poll()}
  catch(e){if(btn){btn.disabled=false;btn.textContent="Confirmer le retrait"}toast(e.message)}
}
function poll(){clearTimeout(pollT);if(!S.tx.some(x=>x.kind==="out"&&(x.status==="En attente"||x.status==="En traitement")))return;
  pollT=setTimeout(async()=>{try{const before=JSON.stringify(S.tx.map(x=>x.status));applyMe(await api("GET","/api/me"));
    if(JSON.stringify(S.tx.map(x=>x.status))!==before){const sent=S.tx.find(x=>x.kind==="out"&&x.status==="Envoyé"&&!x.seen);
      if(view==="wallet"&&sheetWrap.hidden)wallet();const open=sheetWrap.dataset.ref&&!sheetWrap.hidden&&S.tx.find(x=>x.ref===sheetWrap.dataset.ref);if(open)receipt(open)}}catch(e){}poll()},4000)}
function receipt(x){
  const out=x.kind==="out",si=STEPS.indexOf(x.status);
  sheet(`<div style="text-align:center"><span class="mute small">${out?"Retrait":"Gain"}</span><div class="amount" style="color:${out?"var(--ink)":"var(--mint)"}">${x.amount>0?"+":"−"}${fcfa(Math.abs(x.amount))}</div></div>
    ${out?`<ol class="tl">${STEPS.map((s,i)=>`<li class="${i<=si?"on":""}"><b>${s}</b><span class="mute small">${x.steps&&x.steps[i]?esc(fmtDate(x.steps[i])):"—"}</span></li>`).join("")}</ol>`:""}
    <div class="kv"><span class="mute">Libellé</span><b style="text-align:right">${esc(x.label)}</b></div>
    <div class="kv"><span class="mute">Date</span><b>${esc(fmtDate(x.at))}</b></div>
    ${out?`<div class="kv"><span class="mute">Numéro</span><b>${esc(x.num||"")}</b></div><div class="kv"><span class="mute">Référence</span><b>${esc(x.ref||"")}</b></div>`:""}
    <div class="kv"><span class="mute">Statut</span><b>${esc(x.status)}</b></div>
    <button class="btn ghost" data-act="closeSheet">Fermer</button>`);
  sheetWrap.dataset.ref=x.ref||"";
}

/* ---------- profil ---------- */
function profile(){
  const u=S.user,[cn,cc]=COUNTRIES[u.country];
  app.innerHTML=`
  <h1>Mon profil</h1>
  <div class="card row"><span class="avatar" style="width:60px;height:60px;border-radius:30px;font-size:24px">${esc(u.name[0].toUpperCase())}</span>
  <div><b style="font-size:19px">${esc(u.name)}</b> <span class="verified">Vérifié</span><div class="mute small">${esc(cn)} · ${cc} ${esc(u.phone)}</div><div class="mute small">${esc(u.op)}${u.since?" · membre depuis le "+esc(new Date(u.since).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})):""}</div></div></div>
  <div class="stats"><div class="card"><span class="mute small">Vidéos validées</span><b>${S.watched}</b></div><div class="card"><span class="mute small">Total gagné</span><b style="font-size:20px">${fcfa(S.total)}</b></div></div>
  <section class="refer"><h2>Invite tes amis</h2><span style="opacity:.95">Partage ton code : vous recevez tous les deux un bonus dès sa première vidéo validée.</span>
  <div class="row"><span class="code">${esc(u.code)}</span><button class="wbtn" data-act="copy" style="color:var(--coral)">Copier</button></div></section>
  ${S.admin?`<button class="card adcta" data-go="advertise"><span class="ic">${I.up}</span><span><b>Ajouter des vidéos</b><br><span class="mute small">Espace administrateur</span></span></button>`:""}
  <section class="card" style="display:flex;flex-direction:column;gap:14px"><h2>Règles du jeu</h2>
  <ul class="rules">
    <li><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></i>Une validation par vidéo et par jour</li>
    <li><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M13 5l7 7-7 7M4 5l7 7-7 7"/><path d="M3 21L21 3"/></svg></i>Pas d’avance rapide</li>
    <li><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></i>Pause automatique hors de l’écran</li>
    <li><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></i>Une mauvaise réponse annule le gain</li>
  </ul></section>
  ${installEvt?`<button class="btn" data-act="install">Installer VuPay sur mon téléphone</button>`:""}
  <button class="btn ghost" data-act="logout">Se déconnecter</button>`;
}

function onClick(e){
  const b=e.target.closest("button");if(!b||b.disabled)return;
  if(b.dataset.go)return go(b.dataset.go);
  if(b.dataset.filter){filter=b.dataset.filter;return tasks()}
  if(b.dataset.task)return openTask(b.dataset.task);
  if(b.dataset.pick){P.pick=+b.dataset.pick;return player()}
  if(b.dataset.op){S.user.op=b.dataset.op;wallet();api("PATCH","/api/me",{op:b.dataset.op}).then(applyMe).catch(e=>toast(e.message));return}
  if(b.dataset.regop){const nm=$("nm");if(nm)reg.name=nm.value;reg.op=b.dataset.regop;return details()}
  if(b.dataset.amt){$("wa").value=b.dataset.amt;return}
  if(b.dataset.tx)return receipt(S.tx[+b.dataset.tx]);
  if(b.dataset.del){if(b.dataset.sure){const id=b.dataset.del;api("DELETE","/api/videos/"+id).then(async()=>{MINE=MINE.filter(c=>c.id!==id);VIDEOS=await api("GET","/api/videos");advertise();toast("Vidéo retirée")}).catch(e=>toast(e.message))}else{b.dataset.sure="1";b.textContent="Confirmer"}return}
  const a=b.dataset.act;
  if(a==="back")return go("tasks");
  if(a==="play")return play();
  if(a==="pause")return pause();
  if(a==="close")return closeFull();
  if(a==="submit")return submit();
  if(a==="closeSheet")return closeSheet();
  if(a==="confirmOut")return confirmOut();
  if(a==="login"){reg={step:"login"};render();return window.scrollTo(0,0)}
  if(a==="toLanding"){reg=null;otp=null;smsEl.hidden=true;render();return window.scrollTo(0,0)}
  if(a==="toLogin"){reg={step:"login"};otp=null;return render()}
  if(a==="toDetails"){reg.step="details";otp=null;return render()}
  if(a==="resend"){sendOtp(!!reg.login).then(ok=>{if(ok&&view)otpView()});return}
  if(a==="copy"){try{navigator.clipboard.writeText(S.user.code).then(()=>toast("Code copié"),()=>toast("Ton code : "+S.user.code))}catch(err){toast("Ton code : "+S.user.code)}return}
  if(a==="install"&&installEvt){installEvt.prompt();installEvt=null;return}
  if(a==="logout"){if(b.dataset.sure){api("POST","/api/logout").catch(()=>{});setToken(null);S=fresh();VIDEOS=[];MINE=null;view="tasks";render();window.scrollTo(0,0);toast("Déconnecté")}else{b.dataset.sure="1";b.textContent="Toucher encore pour te déconnecter"}}
}
app.addEventListener("click",onClick);full.addEventListener("click",onClick);sheetWrap.addEventListener("click",e=>{if(e.target===sheetWrap)return closeSheet();onClick(e)});
nav.addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.go)});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&P.playing){pause();toast("Vidéo en pause")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!sheetWrap.hidden)closeSheet();else if(P.full)closeFull()}});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(view==="profile"&&S.user)profile()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
(async function boot(){
  if(!TOKEN)return render();
  app.innerHTML=`<div class="boot">${logo}<span>Chargement…</span></div>`;
  try{await loadAll();render();poll()}
  catch(e){if(!TOKEN)return render();app.innerHTML=`<div class="boot">${logo}<p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Réessayer</button></div>`}
})();
}
